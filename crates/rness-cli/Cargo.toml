[package]
name = "rness-cli"
description = "The rness binary: config layers, composition root, mode selection (tui/server/headless)."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rness"
path = "src/main.rs"

[features]
default = []
experimental-control = []

[dependencies]
rness-kernel.workspace = true
rness-protocol.workspace = true
rness-engine.workspace = true
rness-providers.workspace = true
rness-tools.workspace = true
rness-lua.workspace = true
rness-tui.workspace = true
rness-server.workspace = true
axum.workspace = true
clap.workspace = true
dirs.workspace = true
keyring.workspace = true
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
ulid.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

crossterm.workspace = true
ratatui.workspace = true
textwrap.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Memory"] }

[dev-dependencies]
tokio-util.workspace = true
tempfile.workspace = true
